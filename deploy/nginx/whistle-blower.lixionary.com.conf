server {
    listen 80;
    listen [::]:80;
    server_name whistle-blower.lixionary.com;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://whistle-blower.lixionary.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whistle-blower.lixionary.com;

    ssl_certificate /etc/letsencrypt/live/whistle-blower.lixionary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whistle-blower.lixionary.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reporter paths, cookies, destinations and payloads must not enter logs.
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; frame-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace untrusted client headers rather than append them.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_hide_header X-Powered-By;
    # Avoid duplicate security headers inherited from the frontend.
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:9550; }
    # Next preserves nginx's normalized forwarding headers when proxying the
    # private service. Its database/API have no additional published host port.
    location / { proxy_pass http://127.0.0.1:9551; }
}
