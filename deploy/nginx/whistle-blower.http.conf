# Temporary HTTP-only site for the first Certbot webroot challenge.
# Install the HTTPS configuration after the certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name whistle-blower.lixionary.com;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
